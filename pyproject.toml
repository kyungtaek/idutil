[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-disk-util"
version = "0.2.0"
description = "Worktrunk companion for isolated Xcode build data and conservative garbage collection"
requires-python = ">=3.9"
dependencies = ["tomlkit>=0.13,<1"]

[project.scripts]
idutil = "idutil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idutil = ["assets/ios-disk-util/SKILL.md"]
